<!DOCTYPE html>
<html lang="hi">
<head>

        }
        h1 {
            color: #ff5722;
        }
        .game-card {
            background: white;
            padding: 15px;

            border-radius: 10px;

            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            margin-top: 10px;

    <p>Apna game khele aur earn karein</p>

    <div class="game-card">
        <!-- Yahan photo ka link dalein -->
        <img src="YAHAN_GAME_KE_PHOTO_KA_LINK_DAALEIN" alt="Game Photo">
        
        <h3>Game Name</h3>
        
        <!-- Yahan apna referral link dalein -->
        <a href="YAHAN_APNA_REFERRAL_LINK_DAALEIN" class="btn" target="_blank">Play & Earn</a>

</html>
